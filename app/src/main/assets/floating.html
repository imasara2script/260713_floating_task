<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Task V2</title>
    <link rel="stylesheet" href="style.css">
    <script src="translations.js"></script>
    <script src="app.js"></script>
    <style>
        /* カスタムドロップダウンメニューのスタイル */
        .nav-menu-container {
            position: relative;
            flex-shrink: 0;
        }
        .nav-menu-trigger {
            width: 65px;
            height: 24px;
            font-size: 11px;
            background: white;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .nav-menu-list {
            display: none;
            position: absolute;
            top: 28px;
            right: 0;
            width: 90px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            z-index: 1000;
            overflow: hidden;
        }
        .nav-menu-item {
            padding: 8px 12px;
            font-size: 13px;
            color: #333;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            white-space: nowrap;
        }
        .nav-menu-item:last-child {
            border-bottom: none;
        }
        .nav-menu-item:active {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body style="background: transparent; margin: 0; padding: 0; overflow: hidden; height: 100%;">
    <div id="floating-collapsed" class="floating-label-collapsed" onclick="if(!isDragging) toggleFloatingExpand(true)">
        <!-- JavaScript で動的に生成 -->
    </div>
    <div id="floating-expanded" class="compact-container" style="display: none; width: 100%; height: 100%; flex-direction: column; padding: 0;">
        <div id="floatingTaskContent" style="width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column;"></div>
    </div>

    <script>
        let isDragging = false;
        let isFloatingExpanded = (urlParams.get('expanded') === 'true');
        let currentFloatingIndex = 0;
        let inputtingCommentForTaskId = null;
        let floatingViewMode = 'tasks'; // 'tasks' or 'history'
        let isNavMenuOpen = false;
        let originalHeightPx = 44;

        function initializeV2() {
            console.log("Floating V2 Initialized");
            applyLanguage();
            // 初期状態の反映
            toggleFloatingExpand(isFloatingExpanded, true);
        }

        function toggleFloatingExpand(expand, fromAndroid = false) {
            isFloatingExpanded = expand;
            const collapsedEl = document.getElementById('floating-collapsed');
            const expandedEl = document.getElementById('floating-expanded');
            if (collapsedEl) collapsedEl.style.display = expand ? 'none' : 'flex';
            if (expandedEl) expandedEl.style.display = expand ? 'flex' : 'none';

            // 倍率の再適用
            const scale = expand ?
                (localStorage.getItem('floatExpandedScale') || '1.0') :
                (localStorage.getItem('floatCollapsedScale') || '1.0');
            updateScale(scale);

            if (!fromAndroid && typeof Android !== 'undefined' && Android.toggleExpand) {
                Android.toggleExpand(expand);
            }

            // メモ入力中のフォーカス制御
            if (inputtingCommentForTaskId !== null && typeof Android !== 'undefined' && Android.setFocusable) {
                Android.setFocusable(expand);
            }

            if (expand && inputtingCommentForTaskId !== null) {
                if (typeof Android !== 'undefined' && Android.requestHeight) {
                    Android.requestHeight(150);
                }
            }

            render();
        }

        function updateScale(scale) {
            document.body.style.transform = `scale(${scale})`;
            document.body.style.transformOrigin = 'top left';
            document.body.style.width = (100 / parseFloat(scale)) + '%';
            document.body.style.height = (100 / parseFloat(scale)) + '%';
        }

        function setIsDragging(dragging) {
            isDragging = dragging;
        }

        function applyFloatingSettings(scale, expanded, dCount, sCount, showCheckedToggle, scrollButtonType, allowDrag, allowDragCollapsed, showHistoryButton, navType, widthPx, heightPx) {
            updateScale(scale);
            if (isFloatingExpanded !== expanded) {
                toggleFloatingExpand(expanded, true);
            }
            if (showHistoryButton !== undefined) {
                localStorage.setItem('showHistoryButton', showHistoryButton);
            }
            if (navType !== undefined) {
                localStorage.setItem('navType', navType);
            }
            if (heightPx !== undefined) {
                originalHeightPx = heightPx;
            }
            refreshData();
        }

        function toggleShowAllInFloating() {
            showAllInFloating = !showAllInFloating;
            localStorage.setItem('showAllInFloating', showAllInFloating);
            render();
        }

        function toggleFloatingViewMode() {
            floatingViewMode = (floatingViewMode === 'tasks') ? 'history' : 'tasks';
            render();
        }

        function toggleNavMenu() {
            isNavMenuOpen = !isNavMenuOpen;
            const menuList = document.getElementById('navMenuList');
            if (menuList) menuList.style.display = isNavMenuOpen ? 'block' : 'none';

            if (typeof Android !== 'undefined' && Android.requestHeight) {
                if (isNavMenuOpen) {
                    // メニュー表示用に高さを拡張 (250dp程度確保)
                    Android.requestHeight(250);
                } else {
                    // 元の高さに戻す
                    restoreOriginalHeight();
                }
            }
        }

        function handleNavAction(val) {
            // まずメニューを閉じて高さを戻す処理を確実に行う
            if (isNavMenuOpen) {
                isNavMenuOpen = false;
                const menuList = document.getElementById('navMenuList');
                if (menuList) menuList.style.display = 'none';
                restoreOriginalHeight();
            }

            if (val === 'home') {
                if (typeof Android !== 'undefined' && Android.openMainActivity) Android.openMainActivity();
            } else if (val === 'history') {
                floatingViewMode = 'history';
                render();
            } else if (val === 'all') {
                floatingViewMode = 'tasks';
                if (!showAllInFloating) toggleShowAllInFloating();
                else render();
            } else if (val === 'pending') {
                floatingViewMode = 'tasks';
                if (showAllInFloating) toggleShowAllInFloating();
                else render();
            } else if (val === 'prev') {
                prevTask();
            } else if (val === 'next') {
                nextTask();
            }
        }

        function restoreOriginalHeight() {
            if (typeof Android !== 'undefined' && Android.restoreHeight) {
                Android.restoreHeight();
            }
        }

        function nextTask() {
            const scrollButtonType = localStorage.getItem('scrollButtonType') || 'both';
            if (scrollButtonType === 'scroll') {
                const container = document.getElementById('floating-task-container');
                if (container) {
                    container.scrollBy({ top: container.clientHeight * 0.8, behavior: 'smooth' });
                }
                return;
            }
            const floatingTasks = getVisibleFloatingTasks();
            if (floatingTasks.length > 0) {
                currentFloatingIndex = (currentFloatingIndex + scrollTaskCount) % floatingTasks.length;
                render();
            }
        }

        function prevTask() {
            const scrollButtonType = localStorage.getItem('scrollButtonType') || 'both';
            if (scrollButtonType === 'scroll') {
                const container = document.getElementById('floating-task-container');
                if (container) {
                    container.scrollBy({ top: -container.clientHeight * 0.8, behavior: 'smooth' });
                }
                return;
            }
            const floatingTasks = getVisibleFloatingTasks();
            if (floatingTasks.length > 0) {
                currentFloatingIndex = (currentFloatingIndex - scrollTaskCount + floatingTasks.length) % floatingTasks.length;
                render();
            }
        }

        function toggleTask(id) {
            tasks = tasks.map(t => {
                if (t.id === id) {
                    const newState = !t.completed;
                    if (newState) {
                        if (t.showCommentOnCheck) {
                            inputtingCommentForTaskId = id;
                            if (typeof Android !== 'undefined') {
                                if (Android.requestHeight) Android.requestHeight(150);
                                if (Android.setFocusable) Android.setFocusable(true);
                            }
                            return t;
                        }

                        // 通常の完了処理
                        const historyId = Date.now();
                        history.unshift({
                            id: historyId,
                            taskId: t.id,
                            text: t.text,
                            memo: "",
                            completedAt: new Date().toISOString()
                        });
                        if (history.length > 500) history.pop();

                        t.justCompletedUntil = Date.now() + (checkedHideDelay * 1000);
                        setTimeout(() => render(), checkedHideDelay * 1000);
                    }

                    if (typeof Android !== 'undefined' && Android.updateTaskCompletionState) {
                        Android.updateTaskCompletionState(t.id, newState);
                    }
                    return { ...t, completed: newState };
                }
                return t;
            });
            saveTasks();
        }

        function saveFloatingComment() {
            const ta = document.getElementById('floatingCommentText');
            const memo = ta ? ta.value : "";
            const taskId = inputtingCommentForTaskId;
            if (taskId === null) return;

            completeTaskWithMemo(taskId, memo);

            inputtingCommentForTaskId = null;
            if (typeof Android !== 'undefined') {
                if (Android.setFocusable) Android.setFocusable(false);
            }
            toggleFloatingExpand(isFloatingExpanded);
        }

        function cancelFloatingComment() {
            const ta = document.getElementById('floatingCommentText');
            if (ta) {
                const t = tasks.find(x => x.id === inputtingCommentForTaskId);
                const initialNote = (t && t.note) ? t.note : '';
                if (ta.value !== initialNote) {
                    window.nativeConfirm(getTranslation('msg_confirm_discard'), (ok) => {
                        if (ok) {
                            inputtingCommentForTaskId = null;
                            if (typeof Android !== 'undefined') {
                                if (Android.setFocusable) Android.setFocusable(false);
                            }
                            toggleFloatingExpand(isFloatingExpanded);
                        }
                    });
                    return;
                }
            }
            inputtingCommentForTaskId = null;
            if (typeof Android !== 'undefined') {
                if (Android.setFocusable) Android.setFocusable(false);
            }
            toggleFloatingExpand(isFloatingExpanded);
        }

        function repeatTimer(id) {
            tasks = tasks.map(t => {
                if (t.id === id && t.durationMs) {
                    const melody = t.melody || 'default';
                    if (typeof Android !== 'undefined' && Android.setTimerAlarm) {
                        Android.setTimerAlarm(t.id, t.text, t.durationMs, melody);
                    }
                    const historyId = Date.now();
                    history.unshift({
                        id: historyId,
                        taskId: t.id,
                        text: t.text + getTranslation('repeat_suffix'),
                        memo: "",
                        completedAt: new Date().toISOString()
                    });
                    if (history.length > 500) history.pop();
                    return { ...t, startTime: Date.now(), completed: false };
                }
                return t;
            });
            saveTasks();
        }

        function toggleTimerDisplayMode() {
            timerDisplayMode = (timerDisplayMode === 'countdown') ? 'endtime' : 'countdown';
            render();
        }

        function render() {
            const floatingTasks = getVisibleFloatingTasks();
            const collapsedEl = document.getElementById('floating-collapsed');
            const expandedEl = document.getElementById('floating-expanded');
            const floatingContent = document.getElementById('floatingTaskContent');

            if (typeof Android !== 'undefined' && Android.updatePendingTaskCount) {
                try {
                    Android.updatePendingTaskCount(floatingTasks.length);
                } catch(e) {}
            }

            if (currentFloatingIndex >= floatingTasks.length) {
                currentFloatingIndex = Math.max(0, floatingTasks.length - 1);
            }

            // 配色ルールの計算
            const activeTimers = tasks.filter(t => t.durationMs && !t.completed)
                .map(t => ({...t, remaining: Math.max(0, (t.startTime + t.durationMs) - Date.now())}))
                .filter(t => t.remaining > 0)
                .sort((a, b) => a.remaining - b.remaining);

            let appliedBgColor = '#ffffff';
            let appliedTextColor = '#333333';
            if (activeTimers.length > 0) {
                const shortestRemaining = activeTimers[0].remaining / 1000;
                const sortedRules = [...bgThresholds].sort((a, b) => a.threshold - b.threshold);
                const rule = sortedRules.find(r => shortestRemaining <= r.threshold);
                if (rule) {
                    appliedBgColor = rule.bgColor;
                    appliedTextColor = rule.textColor;
                }
            }

            // スタイルの適用
            if (collapsedEl) {
                collapsedEl.style.backgroundColor = appliedBgColor;
                collapsedEl.style.color = appliedTextColor;
                if (activeTimers.length > 0) {
                    const timeText = getRemainingTimeText(activeTimers[0]);
                    collapsedEl.innerHTML = `<div class="ft-tiny">FT</div><div class="timer-collapsed-large" id="timer-collapsed-text">${timeText}</div>`;
                } else {
                    collapsedEl.innerHTML = `<div>Floating</div><div>task</div>`;
                }
            }

            if (expandedEl) {
                expandedEl.style.backgroundColor = appliedBgColor;
                expandedEl.style.color = appliedTextColor;
            }

            if (floatingContent) {
                if (inputtingCommentForTaskId !== null) {
                    if (document.getElementById('floatingCommentText')) return;
                    const t = tasks.find(x => x.id === inputtingCommentForTaskId);
                    const initialNote = (t && t.note) ? t.note : '';
                    floatingContent.innerHTML = `
                        <div class="floating-comment-container">
                            <div class="floating-comment-title">${t ? t.text : ''}</div>
                            <textarea id="floatingCommentText" class="floating-comment-textarea" placeholder="${getTranslation('placeholder_history_memo')}">${initialNote}</textarea>
                            <div class="floating-comment-actions">
                                <button class="btn btn-tiny" onclick="cancelFloatingComment()">${getTranslation('btn_no_comment')}</button>
                                <button class="btn btn-primary btn-tiny" onclick="saveFloatingComment()">${getTranslation('btn_save_comment')}</button>
                            </div>
                        </div>
                    `;
                    setTimeout(() => {
                        const ta = document.getElementById('floatingCommentText');
                        if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
                        if (typeof Android !== 'undefined' && Android.showKeyboard) Android.showKeyboard();
                    }, 100);
                    return;
                }

                const showClose = localStorage.getItem('showCloseButtonExpanded') === 'true';
                const headerPaddingRight = showClose ? '40px' : '8px';
                const showCheckedToggle = localStorage.getItem('showCheckedToggle') === 'true';
                const showHistoryButton = localStorage.getItem('showHistoryButton') === 'true';
                const navType = localStorage.getItem('navType') || 'button';

                if (floatingViewMode === 'history') {
                    // 履歴モードの描画
                    let navHtml = '';
                    if (navType === 'menu') {
                        navHtml = `
                            <div class="nav-menu-container">
                                <button class="nav-menu-trigger" onclick="toggleNavMenu()">${getTranslation('nav_menu_title')} ▼</button>
                                <div id="navMenuList" class="nav-menu-list">
                                    <div class="nav-menu-item" onclick="handleNavAction('pending')">${getTranslation('nav_menu_show_pending')}</div>
                                    <div class="nav-menu-item" onclick="handleNavAction('all')">${getTranslation('nav_menu_show_all')}</div>
                                    <div class="nav-menu-item" onclick="handleNavAction('home')">${getTranslation('nav_menu_home')}</div>
                                </div>
                            </div>
                        `;
                    } else {
                        const buttonsWidth = 36 + 6 + (showCheckedToggle ? 42 : 0) + (showHistoryButton ? 42 : 0) + 8;
                        navHtml = `
                            <div style="display: flex; align-items: center; gap: 6px; width: ${buttonsWidth}px; justify-content: flex-end; flex-shrink: 0;">
                                ${showCheckedToggle ? `<button onclick="toggleShowAllInFloating()" style="background: ${!showAllInFloating ? '#007bff' : '#eee'}; border: 1px solid #ccc; border-radius: 4px; width: 36px; height: 24px; padding: 0; font-size: 14px; color: ${!showAllInFloating ? 'white' : '#333'}; cursor: pointer; display: flex; align-items: center; justify-content: center;" title="${!showAllInFloating ? getTranslation('btn_toggle_pending_title') : getTranslation('btn_toggle_all_title')}">👁️</button>` : ''}
                                ${showHistoryButton ? `<button onclick="toggleFloatingViewMode()" style="background: #007bff; border: 1px solid #0056b3; border-radius: 4px; width: 36px; height: 24px; padding: 0; font-size: 14px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;">📜</button>` : ''}
                                <button onclick="if(typeof Android !== 'undefined' && Android.openMainActivity) Android.openMainActivity();" style="background: #007bff; border: none; border-radius: 4px; width: 36px; height: 24px; padding: 0; font-size: 14px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;" title="${getTranslation('btn_full_screen_title')}">🏠</button>
                            </div>
                        `;
                    }

                    const historyHtml = history.length === 0 ?
                        `<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 2px 4px;"><span style="color:#888; font-size:12px;">${getTranslation('msg_history_no_data')}</span></div>` :
                        `<div id="floating-history-container" style="flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 4px;">
                            ${history.slice(0, 50).map(h => `
                                <div style="font-size: 12px; margin-bottom: 4px; padding-bottom: 2px; border-bottom: 1px solid rgba(0,0,0,0.05);">
                                    <div style="font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">${(h.type === 'coin' || h.type === 'coin_ad' || h.type === 'coin_daily') ? '🪙 ' : ''}${h.text}</div>
                                    <div style="font-size: 10px; opacity: 0.6;">${new Date(h.completedAt).toLocaleString()}</div>
                                    ${h.memo ? `<div style="font-size: 10px; font-style: italic; background: rgba(0,0,0,0.03); padding: 2px 4px; border-radius: 2px; margin-top: 1px;">${h.memo}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>`;

                    floatingContent.innerHTML = `
                        <div style="display: flex; flex-direction: column; width: 100%; height: 100%; box-sizing: border-box;">
                            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: inherit; opacity: 0.8; padding: 4px ${headerPaddingRight} 4px 0; border-bottom: 1px solid rgba(0,0,0,0.1); background: rgba(0,0,0,0.03); flex-shrink: 0;">
                                <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 24px; border-right: 1px solid rgba(0,0,0,0.2); background: rgba(0,0,0,0.05); flex-shrink: 0; margin-right: 8px;">
                                    <span style="font-size: 10px; font-weight: bold; opacity: 0.7;">${getTranslation('tab_history')}</span>
                                </div>
                                ${navHtml}
                            </div>
                            ${historyHtml}
                        </div>
                    `;
                    return;
                }

                if (floatingTasks.length === 0) {
                    let navHtml = '';
                    if (navType === 'menu') {
                        navHtml = `
                            <div class="nav-menu-container">
                                <button class="nav-menu-trigger" onclick="toggleNavMenu()">${getTranslation('nav_menu_title')} ▼</button>
                                <div id="navMenuList" class="nav-menu-list">
                                    <div class="nav-menu-item" onclick="handleNavAction('history')">${getTranslation('nav_menu_history')}</div>
                                    <div class="nav-menu-item" onclick="handleNavAction('home')">${getTranslation('nav_menu_home')}</div>
                                </div>
                            </div>
                        `;
                    } else {
                        const buttonsWidth = 36 + 6 + (showCheckedToggle ? 42 : 0) + (showHistoryButton ? 42 : 0) + 8;
                        navHtml = `
                            <div style="display: flex; align-items: center; gap: 6px; width: ${buttonsWidth}px; justify-content: flex-end; flex-shrink: 0;">
                                ${showCheckedToggle ? `<button onclick="toggleShowAllInFloating()" style="background: ${!showAllInFloating ? '#007bff' : '#eee'}; border: 1px solid #ccc; border-radius: 4px; width: 36px; height: 24px; padding: 0; font-size: 14px; color: ${!showAllInFloating ? 'white' : '#333'}; cursor: pointer; display: flex; align-items: center; justify-content: center;" title="${!showAllInFloating ? getTranslation('btn_toggle_pending_title') : getTranslation('btn_toggle_all_title')}">👁️</button>` : ''}
                                ${showHistoryButton ? `<button onclick="toggleFloatingViewMode()" style="background: #eee; border: 1px solid #ccc; border-radius: 4px; width: 36px; height: 24px; padding: 0; font-size: 14px; color: #333; cursor: pointer; display: flex; align-items: center; justify-content: center;">📜</button>` : ''}
                                <button onclick="if(typeof Android !== 'undefined' && Android.openMainActivity) Android.openMainActivity();" style="background: #007bff; border: none; border-radius: 4px; width: 36px; height: 24px; padding: 0; font-size: 14px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;" title="${getTranslation('btn_full_screen_title')}">🏠</button>
                            </div>
                        `;
                    }

                    floatingContent.innerHTML = `
                        <div style="display: flex; flex-direction: column; width: 100%; height: 100%; box-sizing: border-box;">
                            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: inherit; opacity: 0.8; padding: 4px ${headerPaddingRight} 4px 0; border-bottom: 1px solid rgba(0,0,0,0.1); background: rgba(0,0,0,0.03); flex-shrink: 0;">
                                <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 24px; border-right: 1px solid rgba(0,0,0,0.2); background: rgba(0,0,0,0.05); flex-shrink: 0; margin-right: 8px;">
                                    ${localStorage.getItem('allowDrag') !== 'false' ? `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="opacity: 0.7;"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg>` : `<span style="font-size: 10px; font-weight: bold; opacity: 0.7;">${getTranslation('label_collapse')}</span>`}
                                </div>
                                ${navHtml}
                            </div>
                            <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 2px 4px;">
                                <span style="color:#888; font-size:12px;">${getTranslation('none')}</span>
                            </div>
                        </div>
                    `;
                } else {
                    const scrollButtonType = localStorage.getItem('scrollButtonType') || 'both';
                    const isScrollMode = scrollButtonType === 'scroll';
                    const tasksToShow = isScrollMode ? floatingTasks : floatingTasks.slice(currentFloatingIndex, currentFloatingIndex + displayTaskCount);
                    if (!isScrollMode && tasksToShow.length < displayTaskCount && floatingTasks.length > tasksToShow.length) {
                        tasksToShow.push(...floatingTasks.slice(0, displayTaskCount - tasksToShow.length));
                    }

                    let navHtml = '';
                    if (navType === 'menu') {
                        navHtml = `
                            <div class="nav-menu-container">
                                <button class="nav-menu-trigger" onclick="toggleNavMenu()">${getTranslation('nav_menu_title')} ▼</button>
                                <div id="navMenuList" class="nav-menu-list">
                                    <div class="nav-menu-item" onclick="handleNavAction('history')">${getTranslation('nav_menu_history')}</div>
                                    ${showCheckedToggle ? `<div class="nav-menu-item" onclick="handleNavAction('pending')">${getTranslation('nav_menu_show_pending')}</div>` : ''}
                                    ${showCheckedToggle ? `<div class="nav-menu-item" onclick="handleNavAction('all')">${getTranslation('nav_menu_show_all')}</div>` : ''}
                                    ${(scrollButtonType === 'both' || scrollButtonType === 'up') ? `<div class="nav-menu-item" onclick="handleNavAction('prev')">${getTranslation('nav_menu_prev')}</div>` : ''}
                                    ${(scrollButtonType === 'both' || scrollButtonType === 'down') ? `<div class="nav-menu-item" onclick="handleNavAction('next')">${getTranslation('nav_menu_next')}</div>` : ''}
                                    <div class="nav-menu-item" onclick="handleNavAction('home')">${getTranslation('nav_menu_home')}</div>
                                </div>
                            </div>
                        `;
                    } else {
                        let buttonsWidth = 42 + 8;
                        if (showCheckedToggle) buttonsWidth += 42;
                        if (showHistoryButton) buttonsWidth += 42;
                        if (scrollButtonType === 'both') buttonsWidth += 84;
                        else if (scrollButtonType === 'down' || scrollButtonType === 'up') buttonsWidth += 42;
                        const counterWidth = (isScrollMode || displayTaskCount > 1) ? 50 : 35;
                        buttonsWidth += counterWidth;

                        navHtml = `
                            <div style="display: flex; align-items: center; gap: 6px; width: ${buttonsWidth}px; justify-content: flex-end; flex-shrink: 0;">
                                <span class="floating-task-counter" style="font-size: 11px; margin-right: 4px;">${counterText}</span>
                                ${showCheckedToggle ? `<button onclick="toggleShowAllInFloating()" style="background: ${!showAllInFloating ? '#007bff' : '#eee'}; border: 1px solid #ccc; border-radius: 4px; width: 36px; height: 24px; padding: 0; font-size: 14px; color: ${!showAllInFloating ? 'white' : '#333'}; cursor: pointer; display: flex; align-items: center; justify-content: center;">👁️</button>` : ''}
                                ${showHistoryButton ? `<button onclick="toggleFloatingViewMode()" style="background: #eee; border: 1px solid #ccc; border-radius: 4px; width: 36px; height: 24px; padding: 0; font-size: 14px; color: #333; cursor: pointer; display: flex; align-items: center; justify-content: center;">📜</button>` : ''}
                                ${(scrollButtonType === 'both' || scrollButtonType === 'up') ? `<button onclick="prevTask()" style="background: #eee; border: 1px solid #ccc; border-radius: 4px; width: 36px; height: 24px; padding: 0; font-size: 14px; color: #333; cursor: pointer; display: flex; align-items: center; justify-content: center;">△</button>` : ''}
                                ${(scrollButtonType === 'both' || scrollButtonType === 'down') ? `<button onclick="nextTask()" style="background: #eee; border: 1px solid #ccc; border-radius: 4px; width: 36px; height: 24px; padding: 0; font-size: 14px; color: #333; cursor: pointer; display: flex; align-items: center; justify-content: center;">▽</button>` : ''}
                                <button onclick="if(typeof Android !== 'undefined' && Android.openMainActivity) Android.openMainActivity();" style="background: #007bff; border: none; border-radius: 4px; width: 36px; height: 24px; padding: 0; font-size: 14px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;">🏠</button>
                            </div>
                        `;
                    }

                    let tasksHtml = '';
                    let lastKey = null;

                    const getGroupKey = (t) => {
                        if (!t.selectedDays || t.selectedDays.length === 0) return 'daily';
                        return t.selectedDays.sort((a, b) => a - b).join(',');
                    };

                    tasksToShow.forEach((t, i) => {
                        const key = getGroupKey(t);
                        // 前のアイテムとグループが異なる場合（またはページの先頭でデイリー以外の場合）にヘッダーを表示
                        if (key !== lastKey) {
                            if (key !== 'daily') {
                                const headerText = getTaskDaysText(t);
                                tasksHtml += `
                                    <div style="font-size: 10px; font-weight: bold; margin-top: 6px; margin-bottom: 2px; border-bottom: 1px solid rgba(0,0,0,0.1); opacity: 0.7; padding-bottom: 1px;">
                                        ${headerText}
                                    </div>
                                `;
                            } else if (i > 0 && lastKey !== null) {
                                // 途中でデイリーに戻る場合
                                tasksHtml += `
                                    <div style="font-size: 10px; font-weight: bold; margin-top: 6px; margin-bottom: 2px; border-bottom: 1px solid rgba(0,0,0,0.1); opacity: 0.7; padding-bottom: 1px;">
                                        ${getTranslation('header_title').replace('管理', '')}
                                    </div>
                                `;
                            }
                            lastKey = key;
                        }

                        const isTimer = !!t.durationMs;
                        const timerDisplay = isTimer ? (timerDisplayMode === 'countdown' ? `${getRemainingTimeTextDetailed(t)} / ${getTotalTimeText(t)}` : getEndTimeText(t)) : '';
                        const isExpired = isTimer && (t.startTime + t.durationMs <= Date.now());
                        tasksHtml += `
                            <div style="display: flex; align-items: center; min-width: 0; margin-bottom: 2px; padding-left: 2px;">
                                ${t.showCommentOnCheck && !t.completed ? `<span onclick="toggleTask(${t.id})" style="cursor:pointer; margin-right:6px; font-size:14px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;">✏️</span>` : `<input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})" style="width: 16px; height: 16px; margin-right: 6px; flex-shrink: 0;">`}
                                ${isTimer && !t.completed ? `<div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0; margin-right: 6px; opacity: 0.9;"><span class="floating-timer-badge ${isExpired ? 'timer-expired' : ''}" data-task-id="${t.id}" onclick="toggleTimerDisplayMode()" style="font-variant-numeric: tabular-nums; cursor:pointer; background: #ffc107; padding: 1px 4px; border-radius: 3px; font-weight: bold; font-size: 10px; white-space: nowrap;">${timerDisplay}</span><button class="btn-icon" onclick="repeatTimer(${t.id})" style="font-size: 12px; padding: 0; background: none; border: none; cursor: pointer;">🔄</button></div>` : ''}
                                <span class="floating-task-text" style="font-size: 14px; font-weight: bold; margin: 0; flex-grow: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; ${t.completed ? 'text-decoration: line-through; color: #888;' : ''}">${t.text}</span>
                            </div>
                        `;
                    });

                    const counterText = isScrollMode ? `(${floatingTasks.length})` : (displayTaskCount > 1 ? `${currentFloatingIndex + 1}-${(currentFloatingIndex + tasksToShow.length - 1) % floatingTasks.length + 1}/${floatingTasks.length}` : `(${currentFloatingIndex + 1}/${floatingTasks.length})`);
                    const container = document.getElementById('floating-task-container');
                    const savedScrollTop = container ? container.scrollTop : 0;

                    floatingContent.innerHTML = `
                        <div style="display: flex; flex-direction: column; width: 100%; height: 100%; box-sizing: border-box;">
                            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: inherit; opacity: 0.8; padding: 4px ${headerPaddingRight} 4px 0; border-bottom: 1px solid rgba(0,0,0,0.1); background: rgba(0,0,0,0.03); flex-shrink: 0;">
                                <div id="expanded-drag-handle" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 24px; border-right: 1px solid rgba(0,0,0,0.2); background: rgba(0,0,0,0.05); flex-shrink: 0; margin-right: 8px;">
                                    ${localStorage.getItem('allowDrag') !== 'false' ? `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="opacity: 0.7;"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg>` : `<span style="font-size: 10px; font-weight: bold; opacity: 0.7;">${getTranslation('label_collapse')}</span>`}
                                </div>
                                ${navHtml}
                            </div>
                            <div id="floating-task-container" style="flex-grow: 1; display: flex; flex-direction: column; overflow-y: ${isScrollMode ? 'auto' : 'hidden'}; padding: 4px;">
                                ${tasksHtml}
                            </div>
                        </div>
                    `;
                    if (isScrollMode) {
                        const newContainer = document.getElementById('floating-task-container');
                        if (newContainer) newContainer.scrollTop = savedScrollTop;
                    }
                }
            }

            if (typeof Android !== 'undefined' && Android.updateFloatingColors) {
                Android.updateFloatingColors(appliedBgColor, appliedTextColor);
            }
        }

        function updateTimersOnly() {
            const activeTimers = tasks.filter(t => t.durationMs && !t.completed)
                .map(t => ({...t, remaining: Math.max(0, (t.startTime + t.durationMs) - Date.now())}))
                .filter(t => t.remaining >= 0)
                .sort((a, b) => a.remaining - b.remaining);

            const currentActiveIds = tasks.filter(t => t.durationMs && !t.completed).map(t => t.id).sort().join(',');
            if (typeof window.lastActiveIds === 'undefined') window.lastActiveIds = '';
            if (currentActiveIds !== window.lastActiveIds) {
                window.lastActiveIds = currentActiveIds;
                render();
                return;
            }

            tasks.forEach(t => {
                if (t.durationMs && !t.completed) {
                    const isExpired = (t.startTime + t.durationMs <= Date.now());
                    const timerDisplay = (timerDisplayMode === 'countdown' ? `${getRemainingTimeTextDetailed(t)} / ${getTotalTimeText(t)}` : getEndTimeText(t));
                    document.querySelectorAll(`.floating-timer-badge[data-task-id="${t.id}"]`).forEach(el => {
                        if (el.textContent !== timerDisplay) el.textContent = timerDisplay;
                        el.classList.toggle('timer-expired', isExpired);
                    });
                }
            });

            const collapsedTimerText = document.getElementById('timer-collapsed-text');
            if (collapsedTimerText && activeTimers.length > 0) {
                const timeText = getRemainingTimeText(activeTimers[0]);
                if (collapsedTimerText.textContent !== timeText) collapsedTimerText.textContent = timeText;
            }
        }

        setInterval(() => {
            const hasActiveTimers = tasks.some(t => t.durationMs && !t.completed);
            if (hasActiveTimers) updateTimersOnly();
        }, 1000);

        // メニュー外タップで閉じる
        document.addEventListener('click', (e) => {
            if (isNavMenuOpen && !e.target.closest('.nav-menu-container')) {
                toggleNavMenu();
            }
        });

        document.addEventListener('DOMContentLoaded', initializeV2);
    </script>
</body>
</html>
