<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="translations.js"></script>
    <script src="app.js"></script>
    <script src="ui-core.js"></script>
    <script src="task-manager.js"></script>
    <script src="modal-manager.js"></script>
    <script src="history-manager.js"></script>
    <script src="system-handler.js"></script>
    <script src="settings-manager.js"></script>
    <script src="manager-renderer.js"></script>
</head>
<body>

    <!-- 管理画面 (全画面) -->
    <div id="manager-view">
        <div class="tab-container">
            <button id="tab-tasks" class="tab-btn active" onclick="switchTab('tasks')" data-i18n="tab_tasks">タスク</button>
            <button id="tab-history" class="tab-btn" onclick="switchTab('history')" data-i18n="tab_history">履歴</button>
            <button id="tab-settings" class="tab-btn" onclick="switchTab('settings')" data-i18n="tab_settings">設定</button>
        </div>

        <div id="tasks-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h1 style="margin: 0;" data-i18n="header_title">デイリータスク管理</h1>
                <button id="btn-toggle-edit" class="btn btn-secondary" onclick="openEditMenu()" style="padding: 4px 12px; font-size: 14px;" data-i18n="btn_edit_list">リストを編集</button>
            </div>
            <!-- エクスポート操作パネル -->
            <div id="export-controls" class="card" style="display: none; margin-bottom: 16px; background: #e7f3ff; border: 1px solid #b3d7ff;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="export-panel-title" style="font-size: 14px; font-weight: bold; color: #0056b3;" data-i18n="panel_export_title">エクスポートするタスクを選択</span>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn btn-secondary" onclick="cancelBulkMode()" style="padding: 4px 12px; font-size: 13px;" data-i18n="btn_cancel">キャンセル</button>
                        <button id="btn-execute-action" class="btn btn-primary" onclick="executeExportTasks()" style="padding: 4px 12px; font-size: 13px;" data-i18n="btn_export_exec">エクスポート実行</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <!-- 普段表示される追加ボタン -->
                <div id="addTaskTrigger" style="margin-bottom: 8px;">
                    <button class="btn" onclick="openTaskModal()" style="width: 100%; border: 2px dashed #007bff; background: transparent; color: #007bff; font-weight: bold; padding: 12px; border-radius: 8px;" data-i18n="btn_add_task">
                        ＋ 新しいタスクを追加
                    </button>
                </div>

                <ul id="managerTaskList" class="task-list"></ul>
            </div>
        </div>

        <div id="history-content" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h1 id="history-title" style="margin: 0;" data-i18n="history_title">完了履歴</h1>
                <button id="btn-back-history" class="btn btn-secondary" onclick="renderHistory()" style="display: none; padding: 4px 12px; font-size: 14px;" data-i18n="btn_back">戻る</button>
            </div>
            <div id="calendar-view" style="display: none; margin-bottom: 20px;"></div>

            <!-- フィルターグループ -->
            <div id="history-filter" class="card" style="margin-bottom: 16px;">
                <div style="font-weight: bold; margin-bottom: 8px; font-size: 14px;" data-i18n="filter_title">フィルター</div>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <!-- 期間フィルター -->
                    <div>
                        <label style="display: block; font-size: 12px; color: #666; margin-bottom: 4px;" data-i18n="filter_period">表示期間</label>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
                            <label style="font-size: 14px;"><input type="radio" name="filter-period" value="all" checked onchange="setHistoryPeriodFilter('all')"> <span data-i18n="filter_all">全期間</span></label>
                            <label style="font-size: 14px;"><input type="radio" name="filter-period" value="day" onchange="setHistoryPeriodFilter('day')"> <span data-i18n="filter_day">日</span></label>
                            <label style="font-size: 14px;"><input type="radio" name="filter-period" value="week" onchange="setHistoryPeriodFilter('week')"> <span data-i18n="filter_week">週</span></label>
                            <label style="font-size: 14px;"><input type="radio" name="filter-period" value="month" onchange="setHistoryPeriodFilter('month')"> <span data-i18n="filter_month">月</span></label>

                            <input type="date" id="filter-date" style="display: none; padding: 4px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;" onchange="updateHistoryFilterValue(this.value)">
                            <input type="week" id="filter-week" style="display: none; padding: 4px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;" onchange="updateHistoryFilterValue(this.value)">
                            <input type="month" id="filter-month" style="display: none; padding: 4px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;" onchange="updateHistoryFilterValue(this.value)">
                        </div>
                    </div>
                    <!-- タスク名フィルター -->
                    <div>
                        <label style="display: block; font-size: 12px; color: #666; margin-bottom: 4px;" data-i18n="filter_task_name">タスク名検索</label>
                        <input type="text" id="filter-task-query" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;" data-i18n-placeholder="placeholder_filter_task" placeholder="タスク名を入力..." oninput="updateHistoryQueryFilter(this.value)">
                    </div>
                </div>
            </div>

            <div class="card">
                <div id="history-summary" style="font-size: 13px; color: #666; margin-bottom: 8px; font-weight: bold;"></div>
                <div id="historyList"></div>
                <button id="btn-clear-history" class="btn btn-danger" style="margin-top: 12px; width: 100%;" onclick="clearHistory()" data-i18n="btn_clear_history">履歴を削除</button>
            </div>
        </div>

        <div id="settings-content" style="display: none;">
            <h1 data-i18n="settings_title">設定</h1>

            <div class="card" style="margin-bottom: 16px;">
                <div id="settings-main-view">
                    <!-- 1. 言語設定 -->
                    <div>
                        <label for="languageSelect" style="display: block; font-size: 13px; margin-bottom: 8px;" data-i18n="label_language">🌐 言語設定</label>
                        <select id="languageSelect" onchange="updateLanguagePreference()" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ddd; background: white; font-size: 14px;">
                            <option value="system" data-i18n="lang_auto">自動 (システム設定)</option>
                            <option value="ja" data-i18n="lang_ja">日本語</option>
                            <option value="en" data-i18n="lang_en">English</option>
                        </select>
                    </div>

                    <div style="border-top: 1px solid #eee; padding-top: 12px; margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
                        <button class="btn btn-primary" style="width: 100%;" onclick="openPermissionsScreen()" data-i18n="label_system_permissions">⚙️ システム権限関係</button>
                        <button class="btn btn-primary" style="width: 100%;" onclick="openFloatingSettings()" data-i18n="btn_floating_settings">フローティングウィンドウの設定</button>
                        <button class="btn btn-primary" style="width: 100%;" onclick="openNewTaskSettings()" data-i18n="btn_new_task_settings">タスク</button>
                        <button class="btn btn-primary" style="width: 100%;" onclick="openRewardsScreen()" data-i18n="btn_rewards">リワード</button>
                        <button class="btn btn-primary" style="width: 100%;" onclick="openDataManagementScreen()" data-i18n="btn_data">データ</button>
                    </div>

                    <!-- 7. カレンダーのマーク -->
                    <div style="border-top: 1px solid #eee; padding-top: 12px; margin-top: 12px; font-size: 14px;">
                        <label for="calendarMarkInput" style="display: block; margin-bottom: 8px;" data-i18n="label_calendar_mark">カレンダーのマーク (記号や絵文字):</label>
                        <input type="text" id="calendarMarkInput" placeholder="例: ⭕, ✔, ⭐" onchange="updateCalendarMark()" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box;">
                    </div>

                    <!-- 9. 開発者用 -->
                    <div style="border-top: 1px solid #eee; padding-top: 12px; margin-top: 12px;">
                        <button class="btn btn-secondary" onclick="openDeveloperSettings()" style="width: 100%; font-size: 14px;" data-i18n="btn_developer">開発者用</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Language Selection Modal (Initial) -->
    <div id="languageModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 280px; text-align: center;">
            <div class="modal-title" style="font-size: 18px; margin-bottom: 20px;">Select Language / 言語選択</div>
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <button class="btn btn-primary" onclick="setLanguageInitial('ja')" style="width: 100%; padding: 14px; font-size: 16px;">日本語</button>
                <button class="btn btn-primary" onclick="setLanguageInitial('en')" style="width: 100%; padding: 14px; font-size: 16px;">English</button>
            </div>
            <div style="margin-top: 16px; font-size: 12px; color: #888;">
                You can change this later in Settings.<br>
                設定から後で変更できます。
            </div>
        </div>
    </div>

    <!-- Edit Menu Modal -->
    <div id="editMenuModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 250px;">
            <div class="modal-title" data-i18n="modal_edit_menu_title">リスト編集メニュー</div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button class="btn btn-secondary" onclick="startSortMode()" style="width: 100%; background: #f8f9fa; color: #333; border: 1px solid #ddd; text-align: left; padding: 12px;" data-i18n="btn_menu_sort">↕️ 並べ替え</button>
                <button class="btn btn-secondary" onclick="startExportMode()" style="width: 100%; background: #f8f9fa; color: #333; border: 1px solid #ddd; text-align: left; padding: 12px;" data-i18n="btn_menu_export">📤 タスクをエクスポート</button>
                <button class="btn btn-secondary" onclick="startRestore(true)" style="width: 100%; background: #f8f9fa; color: #333; border: 1px solid #ddd; text-align: left; padding: 12px;" data-i18n="btn_menu_import">📥 タスクをインポート</button>
                <button class="btn btn-secondary" onclick="startDeleteMode()" style="width: 100%; background: #fff5f5; color: #dc3545; border: 1px solid #ffdada; text-align: left; padding: 12px;" data-i18n="btn_menu_delete">🗑️ まとめて削除</button>
            </div>
            <div class="modal-actions" style="margin-top: 16px;">
                <button class="btn" onclick="closeEditMenu()" style="width: 100%;" data-i18n="btn_close">閉じる</button>
            </div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <div id="modalTitle" class="modal-title"></div>
            <label for="modalInput" style="display:none;">Input</label>
            <input type="text" id="modalInput" class="modal-input" style="display: none;" aria-labelledby="modalTitle">
            <label for="modalTextarea" style="display:none;">Textarea</label>
            <textarea id="modalTextarea" class="modal-input" style="display: none; height: 150px; resize: vertical;" aria-labelledby="modalTitle"></textarea>
            <div class="modal-actions">
                <button id="modalNeutralBtn" class="btn btn-secondary" style="display: none;"></button>
                <button id="modalCancelBtn" class="btn" onclick="closeModal()">キャンセル</button>
                <button id="modalConfirmBtn" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px; width: 90%;">
            <div id="taskModalTitle" class="modal-title" data-i18n="task_modal_add">新しいタスクを追加</div>

            <!-- View Mode Container -->
            <div id="taskViewContainer" style="display: none;">
                <div id="viewTaskText" style="font-size: 18px; font-weight: bold; margin-bottom: 12px; word-break: break-all;"></div>
                <div id="viewTaskTimer" style="font-size: 14px; color: #666; margin-bottom: 12px; display: none;"></div>
                <div id="viewTaskDays" style="font-size: 14px; color: #666; margin-bottom: 12px; display: none; background: #f8f9fa; padding: 8px; border-radius: 6px; border: 1px solid #eee;"></div>
                <div id="viewTaskReminders" style="font-size: 14px; color: #666; margin-bottom: 12px; display: none; background: #f0f7ff; padding: 8px; border-radius: 6px;"></div>
                <div id="viewTaskLinks" style="font-size: 14px; color: #666; margin-bottom: 12px; display: none; background: #e7f3ff; padding: 8px; border-radius: 6px;"></div>
                <div id="viewNoteGroup">
                    <div style="color: #666; font-size: 12px; margin-bottom: 4px;" data-i18n="label_note">補足文章：</div>
                    <div id="viewTaskNote" style="font-size: 14px; background: #f8f9fa; padding: 10px; border-radius: 6px; min-height: 40px; white-space: pre-wrap; margin-bottom: 20px; border: 1px solid #eee; word-break: break-all;"></div>
                </div>
            </div>

            <!-- Edit Mode Container -->
            <div id="taskEditContainer">
                <div class="input-group" style="margin-bottom: 12px;">
                    <label for="taskInput" style="display:none;" data-i18n="label_task_name">タスク名:</label>
                    <input type="text" id="taskInput" placeholder="タスク名を入力..." onkeydown="if(event.key==='Enter') addTask()" aria-label="新しいタスク名" data-i18n-placeholder="placeholder_task_name">
                </div>
                <div class="timer-group" id="timerGroup" style="margin-bottom: 12px;">
                    <label for="timerUnit" style="color: #666; font-size: 14px;" data-i18n="label_timer">タイマー：</label>
                    <select id="timerUnit" onchange="toggleTimerInput(true)" style="padding: 6px; border-radius: 6px; border: 1px solid #ddd; background: white; font-size: 14px;">
                        <option value="none" data-i18n="timer_none">無し</option>
                        <option value="duration" data-i18n="timer_duration">経過時間</option>
                        <option value="at" data-i18n="timer_at">時刻</option>
                        <option value="biweekly" data-i18n="timer_biweekly">隔週</option>
                    </select>
                    <input type="number" id="timerValue" class="timer-input" placeholder="数" min="1" style="display: none; padding: 6px; width: 60px; font-size: 14px;" aria-label="時間">
                    <button id="durationBtn" class="btn btn-secondary" style="display: none; padding: 6px 12px; font-size: 14px;" onclick="requestDurationPicker()" data-i18n="btn_set_duration">時間を設定</button>
                    <input type="time" id="timeValue" style="display: none; padding: 6px; border-radius: 6px; border: 1px solid #ddd; background: white; font-size: 14px;" aria-label="時刻">
                    <div id="biweeklyGroup" style="display: none; align-items: center; gap: 8px;">
                        <label for="referenceDate" style="color: #666; font-size: 14px;" data-i18n="label_reference_date">基準日：</label>
                        <input type="date" id="referenceDate" style="padding: 6px; border-radius: 6px; border: 1px solid #ddd; background: white; font-size: 14px;" aria-label="基準日">
                    </div>
                </div>
                <div id="melodyGroup" style="margin-bottom: 12px; display: none;">
                    <label for="melodySelect" style="color: #666; font-size: 14px;" data-i18n="label_melody">メロディ：</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <select id="melodySelect" onchange="handleMelodyChange()" style="flex-grow: 1; padding: 6px; border-radius: 6px; border: 1px solid #ddd; background: white; font-size: 14px;">
                            <option value="none" data-i18n="melody_none">なし</option>
                            <option value="default" data-i18n="melody_default">デフォルト</option>
                            <option value="alarm" data-i18n="melody_alarm">アラーム音</option>
                            <option value="chime" data-i18n="melody_chime">チャイム</option>
                            <option value="custom" data-i18n="melody_custom">端末内から選択...</option>
                        </select>
                        <button id="btn-test-melody" class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px; white-space: nowrap;" onclick="toggleMelodyTest()" data-i18n="btn_test_melody">テスト</button>
                    </div>
                    <div id="customMelodyName" style="font-size: 11px; color: #666; margin-top: 4px; display: none;"></div>
                    <div style="margin-top: 8px;">
                        <label for="melodyMode" style="color: #666; font-size: 13px;" data-i18n="label_melody_mode">鳴らし方：</label>
                        <select id="melodyMode" style="width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #ddd; background: white; font-size: 14px;">
                            <option value="once" data-i18n="melody_mode_once">1回のみ</option>
                            <option value="loop" data-i18n="melody_mode_loop">停止するまでエンドレス</option>
                        </select>
                    </div>
                </div>
                <div id="reminderGroup" style="margin-bottom: 12px; display: none; border-top: 1px solid #eee; padding-top: 12px;">
                    <label style="color: #666; font-size: 14px; display: block; margin-bottom: 8px;" data-i18n="label_reminder_notifications">リマインド通知：</label>
                    <div id="reminderList"></div>
                    <button class="btn btn-secondary" onclick="addReminderItem()" style="width: 100%; font-size: 13px; margin-top: 4px;" data-i18n="btn_add_reminder">＋通知を追加</button>
                </div>
                <div id="commentConfigGroup" style="margin-bottom: 12px; border-top: 1px solid #eee; padding-top: 12px;">
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;">
                        <input type="checkbox" id="showCommentOnCheck">
                        <span data-i18n="label_show_comment_on_check">チェックを入れた時にコメント記入欄を表示</span>
                    </label>
                </div>
                <div id="daysGroup" style="margin-bottom: 12px; border-top: 1px solid #eee; padding-top: 12px;">
                    <label style="color: #666; font-size: 14px; display: block; margin-bottom: 8px;" data-i18n="label_reset_days">曜日：</label>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                        <label style="font-size: 13px; display: flex; align-items: center; gap: 2px;"><input type="checkbox" class="reset-day-check" value="0"> <span data-i18n="calendar_sun">日</span></label>
                        <label style="font-size: 13px; display: flex; align-items: center; gap: 2px;"><input type="checkbox" class="reset-day-check" value="1"> <span data-i18n="calendar_mon">月</span></label>
                        <label style="font-size: 13px; display: flex; align-items: center; gap: 2px;"><input type="checkbox" class="reset-day-check" value="2"> <span data-i18n="calendar_tue">火</span></label>
                        <label style="font-size: 13px; display: flex; align-items: center; gap: 2px;"><input type="checkbox" class="reset-day-check" value="3"> <span data-i18n="calendar_wed">水</span></label>
                        <label style="font-size: 13px; display: flex; align-items: center; gap: 2px;"><input type="checkbox" class="reset-day-check" value="4"> <span data-i18n="calendar_thu">木</span></label>
                        <label style="font-size: 13px; display: flex; align-items: center; gap: 2px;"><input type="checkbox" class="reset-day-check" value="5"> <span data-i18n="calendar_fri">金</span></label>
                        <label style="font-size: 13px; display: flex; align-items: center; gap: 2px;"><input type="checkbox" class="reset-day-check" value="6"> <span data-i18n="calendar_sat">土</span></label>
                    </div>
                </div>
                <div id="hyperlinkGroup" style="margin-bottom: 12px; border-top: 1px solid #eee; padding-top: 12px;">
                    <label style="color: #666; font-size: 14px; display: block; margin-bottom: 8px;" data-i18n="label_hyperlinks">ハイパーリンク：</label>
                    <div id="hyperlinkList"></div>
                    <button class="btn btn-secondary" onclick="addHyperlinkItem()" style="width: 100%; font-size: 13px; margin-top: 4px;" data-i18n="btn_add_link">＋リンクを追加</button>
                </div>
                <div id="noteGroup" style="margin-bottom: 20px;">
                    <label for="taskNote" style="color: #666; font-size: 14px; display: block; margin-bottom: 4px;" data-i18n="label_note">補足文章：</label>
                    <textarea id="taskNote" placeholder="補足情報を入力..." style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; height: 120px; resize: none; box-sizing: border-box;" data-i18n-placeholder="placeholder_note"></textarea>
                </div>
                <div style="margin-bottom: 12px; text-align: center;">
                    <button class="btn btn-secondary" style="font-size: 12px; padding: 4px 12px; background: none; border: 1px solid #ccc; color: #888;" onclick="openTemporaryVisibilityModal()" data-i18n="btn_show_hidden_items">非表示設定の項目を一時的に表示</button>
                </div>
            </div>
            <div class="modal-actions" style="display: flex; gap: 8px; justify-content: flex-end; align-items: center;">
                <button id="modalEditBtn" class="btn" style="background: none; border: none; font-size: 24px; padding: 0; display: none;" onclick="switchToEditMode()" title="編集">✏️</button>
                <button id="modalHistoryBtn" class="btn" style="background: none; border: none; font-size: 24px; padding: 0; display: none;" onclick="viewHistoryFromModal()" title="履歴・カレンダーを表示">📅</button>
                <button id="modalDeleteBtn" class="btn" style="background: none; border: none; font-size: 24px; padding: 0; display: none;" onclick="deleteTaskFromModal()" title="タスクを削除">🗑️</button>
                <button class="btn btn-secondary" onclick="closeTaskModal()" data-i18n="btn_cancel">キャンセル</button>
                <button id="taskModalConfirmBtn" class="btn btn-primary" onclick="addTask()" data-i18n="btn_add">追加</button>
            </div>
        </div>
    </div>

    <!-- Temporary Visibility Modal -->
    <div id="tempVisibilityModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 300px;">
            <div class="modal-title" data-i18n="temp_visibility_title">表示する項目を選択</div>
            <div style="font-size: 12px; color: #666; margin-bottom: 12px;" data-i18n="label_select_items_to_show">一時的に表示したい項目にチェックを入れてください</div>
            <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
                <label style="display: flex; align-items: center; cursor: pointer; font-size: 14px;">
                    <input type="checkbox" id="tempShowTimer" style="margin-right: 8px;">
                    <span data-i18n="label_timer_setting">タイマー</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; font-size: 14px;">
                    <input type="checkbox" id="tempShowRemind" style="margin-right: 8px;">
                    <span data-i18n="label_remind_setting">リマインド通知</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; font-size: 14px;">
                    <input type="checkbox" id="tempShowComment" style="margin-right: 8px;">
                    <span data-i18n="label_show_comment_on_check">チェックを入れた時にコメント記入欄を表示</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; font-size: 14px;">
                    <input type="checkbox" id="tempShowDays" style="margin-right: 8px;">
                    <span data-i18n="label_reset_days">曜日</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; font-size: 14px;">
                    <input type="checkbox" id="tempShowNote" style="margin-right: 8px;">
                    <span data-i18n="label_note">補足文章</span>
                </label>
                <label style="display: flex; align-items: center; cursor: pointer; font-size: 14px;">
                    <input type="checkbox" id="tempShowLinks" style="margin-right: 8px;">
                    <span data-i18n="label_hyperlinks">ハイパーリンク</span>
                </label>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeTemporaryVisibilityModal()" data-i18n="btn_cancel">キャンセル</button>
                <button class="btn btn-primary" onclick="applyTemporaryVisibility()" data-i18n="btn_ok">OK</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Core Initialization Call
         */
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                initializeApp();
                if (typeof updateStorageUsage === 'function') updateStorageUsage();
            });
        } else {
            setTimeout(() => {
                initializeApp();
                if (typeof updateStorageUsage === 'function') updateStorageUsage();
            }, 50);
        }
    </script>
</body>
</html>
